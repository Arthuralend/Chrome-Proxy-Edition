name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: win
            arch: x64
          - runner: macos-14
            os: mac
            arch: x64
          - runner: macos-14
            os: mac
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python scripts/fetch-mieru.py --os ${{ matrix.os }} --arch ${{ matrix.arch }}
      - run: npm test
      - run: npm run dist -- --${{ matrix.os }} --${{ matrix.arch }}
      - name: Verify Mac signature and packaged launch
        if: matrix.os == 'mac'
        run: node scripts/verify-mac.cjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Mieru-Browser-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving published files"
          else
            gh release create "$version" artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --prerelease
          fi
